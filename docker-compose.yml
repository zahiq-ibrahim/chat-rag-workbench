services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chatrag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 6005073256
      POSTGRES_DB: chatrag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: chatrag-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: